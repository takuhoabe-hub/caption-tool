# 各サイトの特典・キャンペーンを集めて specials.json を更新する。
# 毎週月曜 朝6時（日本時間）に起動し、前回から20日たっていなければ何もしない（＝およそ3週間に1回）。
# Actions の画面から「Run workflow」を押すと、すぐに確認し直す。
name: 特典の自動確認

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 特典を集める
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/fetch_specials.py specials.json --force
          else
            python3 scripts/fetch_specials.py specials.json
          fi
      - name: 変わっていれば保存
        run: |
          if git diff --quiet -- specials.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specials.json
          git commit -m "特典の自動確認 $(date -u +%Y-%m-%d)"
          git push
